{% extends "base.html" %} {% load static tailwind_tags %} {% load static %} 
{% block content %}
<div class="flex flex-row">
  <div class="h-screen flex flex-col bg-gray-300 sticky border-r border-slate-300"  id="barra-lateral">
    <div class="mt-2 flex items-center justify-center ">
      <img src="{% static "img/logo-simple.png" %}" alt="" class="w-16">
    </div>
    <ul class="m-2 mt-4 flex flex-col items-center justify-center text-2xl gap-3">
      <li class=""><a href="{% url "home" %}"><i class="fa-solid fa-house  text-slate-800 hover:scale-125 hover:text-slate-700 transition-all"></i></a></li>
      <li class=""><a href="{% url "contrato" %}"><i class="fa-solid fa-list text-slate-800 hover:scale-125 hover:text-slate-700 transition-all"></i></a></li>
      {% if rol.rol == 'gestor' %}
        <li class=""><a href="{% url "sp" %}"><i class="fa-solid fa-address-book text-slate-800 hover:scale-125 hover:text-slate-700 transition-all"></i></a>
        </li>
      {% endif %}
      <li class=""><a href="{% url "profile" %}"><i class="fa-solid fa-user text-slate-800 hover:scale-125 hover:text-slate-700 transition-all"></i></a></li>
    </ul>
    <div class="mt-auto flex items-center justify-center mb-4">
      <a href="{% url 'logout' %}" class="flex items-center justify-center">
        <i class="fa-solid fa-right-from-bracket text-2xl text-slate-800 hover:scale-125 hover:text-slate-700 transition-all"></i> 
      </a>
    </div>
  </div>
  <div class="flex h-screen justify-start items-center overflow-y-auto flex-col w-full"> 
        {% block contentdash %}
        {% endblock contentdash %}
  </div>
</div>

{% endblock content %}
